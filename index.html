<body class="gate-body">
<main class="gate">
  <form class="gate-card" id="gate-form" autocomplete="on">
    <svg class="gate-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 10h14v3H9zm0 5h14v3H9zm0 5h9v3H9z"/></svg>
    <h1>DOT Data Tools</h1>
    <p class="gate-sub">Internal tools. Enter the team password to continue.</p>
    <input type="text" name="username" value="DOT Data Tools" autocomplete="username" hidden>
    <label class="gate-label" for="gate-pw">Password</label>
    <input type="password" id="gate-pw" name="password" autocomplete="current-password" required autofocus>
    <label class="gate-chk"><input type="checkbox" id="gate-remember"> Remember on this computer <span>(not on shared computers)</span></label>
    <button type="submit" id="gate-btn">Unlock</button>
    <p class="gate-msg" id="gate-msg" role="alert" hidden></p>
    <p class="gate-foot">Files you open in these tools are processed on your computer only and are never uploaded.</p>
  </form>
  <noscript><p class="gate-msg">Please enable JavaScript to use the tools.</p></noscript>
</main>
<script src="payload.js"></script>
<script src="gate.js"></script>
</body>
